version: '3.8'

services:
  ftp:
    image: fauria/vsftpd
    container_name: ftp-demo
    ports:
      - "21:21"
      - "20:20"
      - "21100-21110:21100-21110"
    environment:
      FTP_USER: test
      FTP_PASS: password
      PASV_ADDRESS: 127.0.0.1
      PASV_MIN_PORT: 21100
      PASV_MAX_PORT: 21110
    restart: always